services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: love_yourself_test
      POSTGRES_USER: love_yourself_test
      POSTGRES_PASSWORD: love_yourself_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U love_yourself_test -d love_yourself_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20
