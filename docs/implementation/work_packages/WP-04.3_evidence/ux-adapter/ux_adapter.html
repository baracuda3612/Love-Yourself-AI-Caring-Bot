<!doctype html><html lang="uk"><meta name="viewport" content="width=device-width, initial-scale=1"><title>WP-04.3 · локальний UX-адаптер</title><style>
*{box-sizing:border-box}body{font:15px/1.4 system-ui;background:#e9eee8;margin:0;color:#23322c}.notice{position:sticky;top:0;background:#263b35;color:white;padding:10px;font-size:12px;z-index:2}main{max-width:440px;margin:auto;padding:12px 12px 340px}.msg{background:white;padding:12px;border-radius:12px;margin:10px 0;overflow-wrap:anywhere}.msg.user{background:#d5eaca;margin-left:50px}.row{display:flex;gap:4px;margin-top:4px}button{border:1px solid #aec1b9;background:#edf3ef;border-radius:6px;padding:10px;flex:1;min-height:44px;font:inherit;color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #7547a5}footer{position:fixed;bottom:0;width:100%;background:#dde6df;padding:8px}footer>div,form{max-width:420px;margin:0 auto 6px}input{width:75%;padding:12px;font:inherit}form button{padding:12px;font-size:14px}.keyboard{margin-top:8px}a{color:#7547a5}</style>
<div class="notice">ЛОКАЛЬНИЙ UX-АДАПТЕР · реальні обробники, одноразова БД · це не Telegram. <a style="color:white" href="/enroll/123">Вебвхід</a></div><main id="messages"></main><footer><form><input aria-label="Повідомлення" autocomplete="off"><button>Надіслати</button></form><div id="keyboard"></div></footer><script>
const main=document.querySelector('main'),keyboard=document.querySelector('#keyboard');let busy=false;
async function send(data){if(busy)return;busy=true;try{const r=await fetch('/ux/action',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});if(!r.ok)throw Error(await r.text());render(await r.json())}catch(e){alert(e.message)}finally{busy=false}}
function rows(list,parent,inline){for(const row of list||[]){const el=document.createElement('div');el.className='row';for(const b of row){const button=document.createElement('button');button.textContent=b.text;button.onclick=()=>b.url?window.open(b.url,'_blank'):send(inline?{callback:b.callback_data}:{text:b.text});el.append(button)}parent.append(el)}}
function render(s){main.replaceChildren();for(const m of s.messages){const el=document.createElement('div');el.className='msg'+(m.user?' user':'');const txt=document.createElement('div');txt.innerHTML=m.text.replace(/\n/g,'<br>');el.append(txt);rows(m.markup.inline_keyboard,el,true);main.append(el)}keyboard.replaceChildren();rows(s.keyboard,keyboard,false);window.scrollTo(0,document.body.scrollHeight)}
document.querySelector('form').onsubmit=e=>{e.preventDefault();const i=document.querySelector('input');if(i.value){const t=i.value;i.value='';send({text:t})}};fetch('/ux/state').then(r=>r.json()).then(render);
</script></html>
